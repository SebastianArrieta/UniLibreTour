<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UniLibreTour — Plataforma interactiva para la gestión y exploración del museo digital universitario.">
    <title>{% block title %}{{ titulo | default('UniLibreTour — Museo Digital') }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include 'components/navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; 2026 UniLibreTour — Museo Digital Interactivo
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
