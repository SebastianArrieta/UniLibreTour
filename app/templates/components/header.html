<header class="site-header">
    <div class="header-inner">
        <a href="{{ url_for('prototipo.home') }}" class="flex items-center gap-3 flex-shrink-0 group">
            {% include 'components/logo.html' %}
            <div class="hidden sm:block">
                <div class="brand-name">UniLibreTour</div>
                <div class="brand-sub">Herencia Digital</div>
            </div>
        </a>

        <nav class="hidden md:flex items-center gap-1">
            <a href="{{ url_for('prototipo.explorar') }}" class="nav-link {{ 'active' if current_page == 'explorar' }}">Explorar</a>
            <a href="{{ url_for('prototipo.hall_fama') }}" class="nav-link {{ 'active' if current_page == 'hall-fama' }}">Hall de la Fama</a>
            <div id="museo-role-nav" class="flex items-center gap-1"></div>
            <a href="{{ url_for('prototipo.ranking') }}" class="nav-link {{ 'active' if current_page == 'ranking' }}">Ranking</a>
        </nav>

        <div class="flex items-center gap-2 flex-shrink-0">
            <a href="{{ url_for('prototipo.buscar') }}" aria-label="Buscar" title="Buscar" class="search-btn flex-shrink-0">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="10" r="6.5" />
                    <line x1="19" y1="19" x2="14.5" y2="14.5" />
                </svg>
            </a>
            <div id="museo-auth-area" class="flex items-center gap-2"></div>
            <button type="button" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema" data-theme="dark">
                <span class="text-sm leading-none select-none" data-theme-icon>☀️</span>
                <div class="theme-toggle-track">
                    <div class="theme-toggle-knob"></div>
                </div>
            </button>
        </div>
    </div>
</header>
