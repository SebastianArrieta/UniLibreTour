<header class="site-header">
    <div class="header-inner flex items-center justify-between">
        <!-- Lado Izquierdo: Marca + Acceso Prioritario al Panel del Rol + Enlaces del Museo -->
        <div class="flex items-center gap-3 md:gap-4 flex-1 min-w-0">
            <a href="{{ url_for('web.home') }}" class="flex items-center gap-2.5 flex-shrink-0 group">
                {% include 'components/logo.html' %}
                <div class="hidden sm:block">
                    <div class="brand-name">UniLibreTour</div>
                    <div class="brand-sub">Herencia Digital</div>
                </div>
            </a>

            <!-- Navegación Pública del Museo -->
            <nav class="hidden md:flex items-center gap-1">
                <a href="{{ url_for('web.explorar') }}" class="nav-link {{ 'active' if current_page == 'explorar' }}">Explorar</a>
                <a href="{{ url_for('web.hall_fama') }}" class="nav-link {{ 'active' if current_page == 'hall-fama' }}">Hall de la Fama</a>
                <a href="{{ url_for('web.ranking') }}" class="nav-link {{ 'active' if current_page == 'ranking' }}">Ranking</a>
            </nav>
        </div>

        <!-- Lado Derecho: Buscar + Perfil + Salir + Tema -->
        <div class="flex items-center gap-2 flex-shrink-0">
            <a href="{{ url_for('web.buscar') }}" aria-label="Buscar" title="Buscar" class="search-btn flex-shrink-0">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="10" r="6.5" />
                    <line x1="19" y1="19" x2="14.5" y2="14.5" />
                </svg>
            </a>
            <div id="museo-auth-area" class="flex items-center gap-2"></div>
            <button type="button" class="theme-toggle" aria-label="Cambiar entre modo claro y oscuro" title="Cambiar tema" role="switch" aria-checked="false">
                <svg class="theme-toggle-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                    <g class="theme-toggle-rays" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                        <path d="M12 1.6v2.9"/>
                        <path d="M12 19.5v2.9"/>
                        <path d="M1.6 12h2.9"/>
                        <path d="M19.5 12h2.9"/>
                        <path d="M4.7 4.7l2 2"/>
                        <path d="M19.3 4.7l-2 2"/>
                        <path d="M4.7 19.3l2-2"/>
                        <path d="M19.3 19.3l-2-2"/>
                    </g>
                    <circle class="theme-toggle-moon" cx="12" cy="12" r="6" fill="currentColor"/>
                    <circle class="theme-toggle-crater" cx="9.6" cy="14" r="1.25" fill="var(--card)"/>
                    <circle class="theme-toggle-crater" cx="7.6" cy="12.4" r="0.8" fill="var(--card)"/>
                    <circle class="theme-toggle-shadow" cx="12" cy="12" r="6" fill="var(--card)"/>
                </svg>
            </button>
        </div>
    </div>
</header>
