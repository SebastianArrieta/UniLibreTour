# Entorno local: servidor Python + MySQL
services:
  db:
    image: mysql:8.0
    container_name: unilibretour-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: museo_root
      MYSQL_DATABASE: museo_db
      MYSQL_USER: museo
      MYSQL_PASSWORD: museo
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unilibretour-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: mysql://museo:museo@db:3306/museo_db
      SESSION_SECRET: cambiar-por-un-secreto-seguro
    depends_on:
      - db
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend

volumes:
  mysql-data:

