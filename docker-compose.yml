# Entorno local: Flask + MySQL
services:
  db:
    image: mysql:8.0
    container_name: unilibretour-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: unilibretour_root
      MYSQL_DATABASE: unilibretour_db
      MYSQL_USER: unilibretour
      MYSQL_PASSWORD: unilibretour
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-punilibretour_root"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unilibretour-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      PORT: 5000
      DATABASE_URL: mysql+pymysql://unilibretour:unilibretour@db:3306/unilibretour_db
      SECRET_KEY: toursecretkey
      JWT_SECRET_KEY: toursecretkey
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  mysql-data:
